{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <h4 class="page-title">Home</h4>

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">List of Colleges</div>
                        <div class="card-category">Page Subtitle</div>
                    </div>

                    <div class="card-body">

                        <!-- Search Form -->
                        <form action="{% url 'college-list' %}"
                              method="get"
                              class="mb-4">

                            <div class="input-group">

                                <input type="text"
                                       name="q"
                                       value="{{ request.GET.q|default:'' }}"
                                       placeholder="Search colleges..."
                                       class="form-control">

                                <div class="input-group-append">
                                    <button type="submit"
                                            class="btn btn-primary">
                                        Search
                                    </button>
                                </div>

                            </div>

                        </form>

                        <!-- College Table -->
                        <table class="table table-striped mt-3">

                            <thead>
                                <tr>
                                    <th scope="col">College Name</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>

                            <tbody>

                                {% for object in object_list %}

                                <tr>
                                    <td>{{ object.college_name }}</td>

                                    <td>
                                        <a href="{% url 'college-update' object.pk %}">
                                            Edit
                                        </a>

                                        <a href="{% url 'college-delete' object.pk %}"
                                           class="text-danger ml-2">
                                            Delete
                                        </a>
                                    </td>
                                </tr>

                                {% empty %}

                                <tr>
                                    <td colspan="2" class="text-center">
                                        <p>No Records Found</p>
                                    </td>
                                </tr>

                                {% endfor %}

                            </tbody>

                        </table>

                        {% include 'includes/pagination.html' %}

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
