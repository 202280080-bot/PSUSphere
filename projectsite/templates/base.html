<!DOCTYPE html>
<html>
<head>
    <title>PSUSphere</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        nav {
            background: #006633;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .nav-links a:hover {
            background: #004d26;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}" class="logo">PSUSphere</a>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'announcements' %}">Announcements</a>
        <a href="{% url 'organizations' %}">Organizations</a>

        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>

<div class="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
