{% extends 'base.html' %}

{% block content %}

<style>
    .profile-container {
        max-width: 600px;
        margin: 50px auto;
    }

    .profile-card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .profile-card h1 {
        color: #006633;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 7px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #006633;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #004d26;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #006633;
        text-decoration: none;
    }
</style>

<div class="profile-container">

    <div class="profile-card">

        <h1>Edit Profile</h1>

        <form method="POST">
            {% csrf_token %}

            <label>First Name</label>
            <input
                type="text"
                name="first_name"
                value="{{ user.first_name }}"
                placeholder="Enter first name"
            >

            <label>Last Name</label>
            <input
                type="text"
                name="last_name"
                value="{{ user.last_name }}"
                placeholder="Enter last name"
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                placeholder="Enter email"
            >

            <button type="submit">
                Save Changes
            </button>
        </form>

        <a href="{% url 'profile' %}" class="back">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
